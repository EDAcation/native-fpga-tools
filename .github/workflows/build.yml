        | tar xvfz -
    - name: Build
      run: ./builder.py build --arch=darwin-arm64 --target=icestorm-full --single
    - name: Tar build output
      env:
        tooldir: _outputs/darwin-arm64/icestorm-full
      run: 'cp ${tooldir}/.hash ${tooldir}/icestorm-full/.hash

        tar -C ${tooldir}/icestorm-full -czf darwin-arm64-icestorm.tgz .'
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: darwin-arm64-icestorm-full
