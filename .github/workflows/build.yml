name: Build
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 0 1 * * *
permissions:
  contents: write
  actions: write
jobs:
  darwin-arm64-ghdl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Inject targets
      run: cp -r edacation oss-cad-suite-build/
    - name: Cache sources
      uses: actions/cache@v4
      with:
        path: oss-cad-suite-build/_sources
        key: cache-sources-ghdl
    - name: Build
      run: 'cd oss-cad-suite-build/

        ./builder.py build --rules=default,edacation --arch=darwin-arm64 --target=ghdl
        --single --tar'
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: darwin-arm64-ghdl
        path: oss-cad-suite-build/darwin-arm64-ghdl.tgz
