  darwin-arm64-yosys:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
    - name: Inject targets
      run: cp -r ../edacation .
    - name: Cache sources
      id: cache-sources
      uses: actions/cache@v5
      with:
        path: oss-cad-suite-build/_sources
        key: cache-sources-yosys
    - name: Download previous build
      run: "URL=\"https://github.com/${{ github.repository }}/releases/download/bucket-darwin-arm64/darwin-arm64-yosys.tgz\"\
        \nif wget --spider \"${URL}\" 2>/dev/null; then\n    wget -qO- \"${URL}\"\
        \ --retry-connrefused --read-timeout=20 --timeout=15 --retry-on-http-error=404\
        \ | tar xvfz -\nelse\n    echo \"Previous version not found in bucket\"\n\
        fi\n"
    - name: Download linux-x64-abc
      run: wget -qO- "https://github.com/${{ github.repository }}/releases/download/bucket-linux-x64/linux-x64-abc.tgz"
        --retry-connrefused --read-timeout=20 --timeout=15 --retry-on-http-error=404
        | tar xvfz -
    - name: Build
      run: ./builder.py build --arch=darwin-arm64 --target=yosys --single --tar
    - uses: ncipollo/release-action@v1
      if: hashFiles('oss-cad-suite-build/darwin-arm64-yosys.tgz') != ''
      with:
        allowUpdates: true
        prerelease: true
        omitBody: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        tag: bucket-darwin-arm64
        artifacts: oss-cad-suite-build/darwin-arm64-yosys.tgz
        token: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: oss-cad-suite-build
