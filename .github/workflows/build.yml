    - darwin-x64-nextpnr-generic-full
    - darwin-x64-nextpnr-ice40-full
    - darwin-x64-nextpnr-ecp5-full
    - darwin-x64-iverilog-full
    - darwin-x64-openfpgaloader-full
    - darwin-x64-prjtrellis-full
    - darwin-x64-icestorm-full
    - darwin-arm64-yosys-full
    - darwin-arm64-nextpnr-generic-full
    - darwin-arm64-nextpnr-ice40-full
    - darwin-arm64-nextpnr-ecp5-full
    - darwin-arm64-iverilog-full
    - darwin-arm64-openfpgaloader-full
    - darwin-arm64-prjtrellis-full
    - darwin-arm64-icestorm-full
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Download target artifacts
      uses: actions/download-artifact@v4
      with:
        path: _tools/
        pattern: '*-full'
        merge-multiple: true
    - name: Extract artifacts
      run: "cd _tools/\nfor file in *.tgz; do\n  echo \"Extracting ${file}...\"\n\
        \  tar -xzf \"$file\" --one-top-level\n  rm \"$file\"\ndone"
    - name: Package tools
      env:
        PYTHONUNBUFFERED: '1'
      run: ./package.py --in-dir=_tools/ --out-dir=_outputs/ --report tools.json
    - name: Get release version
      id: version
      run: echo "version=$(jq -r '.version' tools.json)" >> $GITHUB_OUTPUT
    - name: Release tools
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        files: '_outputs/*

          tools.json'
