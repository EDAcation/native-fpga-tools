name: Build
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 0 1 * * *
permissions:
  contents: write
  actions: write
jobs:
  darwin-arm64-ghdl:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
    - name: Inject targets
      run: cp -r ../edacation .
    - name: Cache sources
      id: cache-sources
      uses: actions/cache@v5
      with:
        path: oss-cad-suite-build/_sources
        key: cache-sources-ghdl
    - name: Download previous build
      run: "URL=\"https://github.com/${{ github.repository }}/releases/download/bucket-darwin-arm64/darwin-arm64-ghdl.tgz\"\
        \nif wget --spider \"${URL}\" 2>/dev/null; then\n    wget -qO- \"${URL}\"\
        \ --retry-connrefused --read-timeout=20 --timeout=15 --retry-on-http-error=404\
        \ | tar xvfz -\nelse\n    echo \"Previous version not found in bucket\"\n\
        fi\n"
    - name: Build
      run: ./builder.py build --arch=darwin-arm64 --target=ghdl --single --tar
    - uses: ncipollo/release-action@v1
      if: hashFiles('oss-cad-suite-build/darwin-arm64-ghdl.tgz') != ''
      with:
        allowUpdates: true
        prerelease: true
        omitBody: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        tag: bucket-darwin-arm64
        artifacts: oss-cad-suite-build/darwin-arm64-ghdl.tgz
        token: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: oss-cad-suite-build
