    - uses: actions/checkout@v5
    - name: Inject targets
      run: cp -r ../edacation .
    - name: Download darwin-arm64-icestorm
      run: wget -qO- "https://github.com/${{ github.repository }}/releases/download/bucket-darwin-arm64/darwin-arm64-icestorm.tgz"
